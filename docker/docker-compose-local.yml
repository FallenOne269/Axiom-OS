services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [axiom]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks: [axiom]

  ollama:
    image: ollama/ollama:0.3.14
    profiles: ["models"]
    volumes:
      - ${AXIOM_MODEL_CACHE:-~/.cache/axiom/models}:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks: [axiom]

  axiom-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    profiles: ["agent"]
    environment:
      AXIOM_HOME: /var/lib/axiom
      AXIOM_SIMULATION: "true"
    volumes:
      - ${AXIOM_HOME:-~/.axiom}:/var/lib/axiom
      - ${AXIOM_MODEL_CACHE:-~/.cache/axiom/models}:/models:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [axiom]

networks:
  axiom:
    name: axiom-local
