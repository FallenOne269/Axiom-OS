{{- if .Values.observability.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "axiom.fullname" . }}-rules
  labels:
    app.kubernetes.io/name: {{ include "axiom.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  groups:
    - name: axiom.rules
      interval: 30s
      rules:
        - record: axiom:agent:execution:rate
          expr: rate(axiom_agent_executions_total[5m])
        - record: axiom:agent:latency:p95
          expr: histogram_quantile(0.95, rate(axiom_agent_latency_seconds_bucket[5m]))
        - record: axiom:agent:tokens:total
          expr: increase(axiom_agent_tokens_used_total[5m])
        - alert: AxiomRemoteSubmitBudgetExceeded
          expr: histogram_quantile(0.95, rate(axiom_remote_submit_seconds_bucket[5m])) > {{ div .Values.routing.remoteSubmitBudgetMs 1000 }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: AXIOM remote submission is exceeding its latency budget.
        - alert: AxiomRemoteExecutionCostHigh
          expr: increase(axiom_remote_exec_cost_usd[1h]) > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AXIOM remote execution cost is over the configured hourly threshold.
{{- end }}
