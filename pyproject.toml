[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "axiom-os"
version = "0.1.0"
description = "Hybrid local-to-remote agent orchestration control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Obsidian Meridian" }
]
keywords = ["agents", "kubernetes", "observability", "opentelemetry", "hybrid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]
kubernetes = ["kopf>=1.37,<2", "kubernetes>=30,<33"]
otel = [
  "opentelemetry-api>=1.26,<2",
  "opentelemetry-sdk>=1.26,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.26,<2",
]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]
all = ["axiom-os[http,kubernetes,otel,dev]"]

[project.scripts]
axiom = "axiom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".axiom"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["axiom"]
