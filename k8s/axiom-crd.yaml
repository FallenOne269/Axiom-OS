apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: axiomjobs.axiom.ai
  labels:
    app.kubernetes.io/name: axiom-os
spec:
  group: axiom.ai
  scope: Namespaced
  names:
    plural: axiomjobs
    singular: axiomjob
    kind: AxiomJob
    shortNames:
      - axj
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Location
          type: string
          jsonPath: .status.executionLocation
        - name: Trace
          type: string
          jsonPath: .spec.traceId
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [objective, maxDepth, tokensRemaining, requiredCompute]
              properties:
                objective:
                  type: string
                  minLength: 1
                  maxLength: 100000
                  description: Agent task objective. Never copied into trace labels.
                maxDepth:
                  type: integer
                  minimum: 0
                  maximum: 10
                tokensRemaining:
                  type: integer
                  minimum: 1000
                  maximum: 128000
                contextSizeBytes:
                  type: integer
                  minimum: 0
                requiredCompute:
                  type: object
                  required: [model]
                  properties:
                    model:
                      type: string
                      minLength: 1
                    minVramMb:
                      type: integer
                      minimum: 0
                    gpuRequired:
                      type: boolean
                    preferLocal:
                      type: boolean
                    estimatedLocalLatencyMs:
                      type: number
                      minimum: 0
                parentTaskId:
                  type: string
                traceId:
                  type: string
                  minLength: 8
                  description: Persistent correlation identifier across every execution hop.
                serializedState:
                  type: string
                  description: Base64-encoded execution state; do not place sensitive raw values in metadata.
                executionEnv:
                  type: string
                  enum: [auto, local, remote]
                allowDegradedLocal:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed, Rejected, Unknown]
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                executionLocation:
                  type: string
                  enum: [local, remote, unknown]
                tokensUsed:
                  type: integer
                  minimum: 0
                costEstimate:
                  type: number
                  minimum: 0
                traceSpanId:
                  type: string
                message:
                  type: string
